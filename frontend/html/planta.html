<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");
console.log(id);


fetch(`/backend/apis-php/pagina-planta.php?id=${id}`)
    .then(res => res.json())
    .then(dados => {
        console.log(dados);
        console.log(dados.planta);
        console.log(dados.planta.nome_comum);
        
        const planta = dados.planta;
        const fases = dados.fases;
        const card = document.createElement("div");
        
        card.classList.add("pagina-planta-card"); 
        card.innerHTML = `
            <h1>${planta.nome_comum}</h1>
            <h3>${planta.nome_cientifico}</h3>
            <p>${planta.descricao}</p>
            <hr>
            <h2>Informações de cultivo</h2>
            <p><strong>Dias para germinação:</strong> ${planta.dias_germinacao}</p>
            <p><strong>Dias para crescimento:</strong> ${planta.dias_crescimento}</p>
            <p><strong>Dias para colheita:</strong> ${planta.dias_colheita}</p>
            <p><strong>Água por dia:</strong> ${planta.agua_ml_dia} ml</p>
            <p><strong>Frequência de rega:</strong> ${planta.frequencia_rega_dias} dia(s)</p>
            <p><strong>Horas de sol:</strong> ${planta.horas_sol_dia} h/dia</p>
            <hr>
            <h2>Solo e clima</h2>
            <p><strong>Tipo de solo:</strong> ${planta.tipo_solo}</p>
            <p><strong>pH ideal:</strong> ${planta.ph_solo_ideal}</p>
            <p><strong>Clima adequado:</strong> ${planta.clima_adequado}</p>
            <p><strong>Temperatura mínima:</strong> ${planta.temperatura_min}°C</p>
            <p><strong>Temperatura máxima:</strong> ${planta.temperatura_max}°C</p>
            <p><strong>Umidade ideal:</strong> ${planta.umidade_ideal}</p>
            <p><strong>Região ideal:</strong> ${planta.regiao_ideal}</p>
            <hr>
            <h2>Adubação</h2>
            <p><strong>Tipo de adubo:</strong> ${planta.tipo_adubo}</p>
            <p><strong>Frequência:</strong> ${planta.frequencia_adubacao}</p>
            <p><strong>Espaçamento:</strong> ${planta.espacamento_cm} cm</p>
            <p><strong>Profundidade do plantio:</strong> ${planta.profundidade_plantio_cm} cm</p>
            <hr>
            <h2>Problemas comuns</h2>
            <p><strong>Pragas:</strong> ${planta.pragas_comuns}</p>
            <p><strong>Doenças:</strong> ${planta.doencas_comuns}</p>
            <button id="btn-comecar-cultivo">
                Começar cultivo
            </button>
        `;
        const fasesContainer = document.createElement("div");
        fasesContainer.classList.add("pagina-planta-fase-container");
        

        fases.forEach(fase => {
            const fase_planta = document.createElement("div");
            fase_planta.classList.add("planta-fase");

            fase_planta.innerHTML = `
                <h2>Fase ${fase.ordem}</h2>
                <h3>${fase.nome_fase}</h3>
                <p>${fase.descricao}</p>
                <p>
                    <strong>Duração:</strong>
                    ${fase.duracao_dias} dias
                </p>
                <p>
                    <strong>Dica:</strong>
                    ${fase.dica_cuidado}
                </p>
                <img
                    src="${fase.imagem_url}"
                    alt="${fase.nome_fase}"
                >
            `;

            fasesContainer.appendChild(fase_planta);
        });



        document.body.appendChild(card);
        document.body.appendChild(fasesContainer);
       
});
    

    
</script>
